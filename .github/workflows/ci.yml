name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # UI 测试用 Avalonia.Headless.XUnit：不需要真实显示器，Windows runner 即可。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        run: dotnet --info

      # 与本地基线一致：单进程构建，必须 0 warning / 0 error
      - name: Build
        run: dotnet build NPKStudio.sln -m:1 --configuration Debug

      # 复用上一步的构建产物；347 个测试必须全绿
      - name: Test
        run: dotnet test NPKStudio.sln --no-build --configuration Debug --verbosity normal
